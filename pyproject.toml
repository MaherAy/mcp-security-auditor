[project]
name = "mcp-security-auditor"
version = "0.1.0"
description = "Multi-agent (A2A) static security auditor for MCP servers."
readme = "README.md"
authors = [
    { name = "MaherAy", email = "maher.ayachi@etudiant-isi.utm.tn" }
]
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.11.0",
    "litellm>=1.105.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auditor"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Mistral API (skipped without MISTRAL_API_KEY)"]
filterwarnings = [
    # Bruit interne à ADK (fonctionnalités expérimentales activées par défaut,
    # et ADK qui instancie lui-même sa classe MCPTool dépréciée).
    'ignore:\[EXPERIMENTAL\]:UserWarning',
    "ignore:MCPTool class is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
# La cible vulnérable est volontairement « sale » : on ne la linte pas.
extend-exclude = ["targets/weak_server"]
