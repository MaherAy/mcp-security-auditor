[project]
name = "mcp-security-auditor"
version = "0.1.0"
description = "Multi-agent (A2A) static security auditor for MCP servers."
readme = "README.md"
authors = [
    { name = "MaherAy", email = "maher.ayachi@etudiant-isi.utm.tn" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auditor"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
